services:
  nexus_engine:
    build: .
    container_name: nexus_engine_v10_5
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./memory_data:/app/memory_data
      - ./memory:/app/memory
      - ./agents:/app/agents
      - ./skills:/app/skills
      - ./core:/app/core
      - ./config:/app/config
      - ./tradingview-mcp:/app/tradingview-mcp
      - ./main.py:/app/main.py
      - ./rules.json:/app/rules.json
    ports:
      - "8005:8005"
    networks:
      - nexus_net

  nexus_dashboard:
    build: .
    container_name: nexus_swarm_dashboard_v10_5
    restart: always
    volumes:
      - ./memory_data:/app/memory_data
      - ./dashboard:/app/dashboard
    ports:
      - "3030:3030"
    command: python dashboard/server.py
    networks:
      - nexus_net

networks:
  nexus_net:
    driver: bridge
